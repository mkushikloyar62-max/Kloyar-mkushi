<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kloyar Mkushi — ukurasa rasmi. Jua zaidi kuhusu Kloyar Mkushi na ufuatilie mitandao yake ya kijamii.">
  <meta name="author" content="Kloyar Mkushi">
  <meta property="og:title" content="Kloyar Mkushi | Official">
  <meta property="og:description" content="Ukurasa rasmi wa Kloyar Mkushi.">
  <meta property="og:image" content="kloyar-mkushi.png">
  <title>Kloyar Mkushi | Official</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#090909;color:#fff}
    .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;
      background:radial-gradient(circle at 50% 20%,#3a2208 0,#120d08 35%,#090909 70%)}
    .card{width:min(980px,100%);display:grid;grid-template-columns:1fr 1fr;overflow:hidden;
      border:1px solid #8b5a16;border-radius:28px;background:#111;box-shadow:0 25px 80px #000}
    .photo{min-height:650px;background:#000}
    .photo img{width:100%;height:100%;object-fit:cover;display:block}
    .content{padding:55px 45px;display:flex;flex-direction:column;justify-content:center}
    .tag{letter-spacing:4px;color:#d9a441;font-size:13px;font-weight:bold;margin-bottom:15px}
    h1{font-size:clamp(42px,6vw,72px);line-height:.95;margin:0 0 18px}
    h1 span{color:#d9a441}
    .line{width:80px;height:4px;background:#d9a441;margin:8px 0 25px}
    p{color:#c9c9c9;line-height:1.7;font-size:17px}
    .buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:25px}
    a{color:#111;text-decoration:none;background:#d9a441;padding:13px 20px;border-radius:999px;font-weight:bold}
    a.alt{background:#222;color:#fff;border:1px solid #555}
    .note{margin-top:30px;font-size:13px;color:#777}
    footer{text-align:center;padding:20px;color:#777;font-size:13px}
    @media(max-width:760px){.card{grid-template-columns:1fr}.photo{min-height:520px}.content{padding:38px 28px}}
  </style>
</head>
<body>
  <main class="hero">
    <section class="card">
      <div class="photo">
        <img src="kloyar-mkushi.png" alt="Kloyar Mkushi akiwa studio ya kurekodia">
      </div>
      <div class="content">
        <div class="tag">OFFICIAL PROFILE</div>
        <h1>Kloyar <span>Mkushi</span></h1>
        <div class="line"></div>
        <p>
          Karibu kwenye ukurasa rasmi wa <strong>Kloyar Mkushi</strong>.
          Huu ni ukurasa wa kumtambulisha Kloyar, kazi zake, ubunifu wake
          na viungo vya mitandao yake ya kijamii.
        </p>
        <div class="buttons">
          <a href="#" aria-label="TikTok ya Kloyar Mkushi">TikTok</a>
          <a href="#" class="alt" aria-label="Facebook ya Kloyar Mkushi">Facebook</a>
          <a href="#" class="alt" aria-label="Instagram ya Kloyar Mkushi">Instagram</a>
          <a href="#" class="alt" aria-label="YouTube ya Kloyar Mkushi">YouTube</a>
        </div>
        <div class="note">© 2026 Kloyar Mkushi · Official Presence</div>
      </div>
    </section>
  </main>
  <footer>Kloyar Mkushi — Official</footer>
</body>
</html>
